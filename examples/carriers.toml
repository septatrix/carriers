# Global carriers configuration.
# Copy to /etc/carriers/carriers.toml and adjust.

# Hostname of this machine. Used as the EHLO/LHLO name, recorded in the sealed
# Authentication-Results, and used as the `helo` identity when checking inbound SPF.
hostname = "mx.lists.example.org"

# Where the ingress listener binds. Put this behind your MTA on a trusted interface.
# Ignored when started via systemd socket activation (the .socket unit's ListenStream wins).
listen = "127.0.0.1:2400"

# Ingress protocol: "lmtp" (recommended, when a front MTA relays to carriers) or "smtp".
protocol = "lmtp"

# SQLite database holding membership and operational state (dedup, etc.).
db_path = "/var/lib/carriers/carriers.db"

# Directory of per-list `<name>.toml` files.
lists_dir = "/etc/carriers/lists"

# Directory of custom Sieve moderation policies (`<name>.sieve`). Only needed if a list's
# `policy` names a custom script rather than a built-in policy. Each file's name (without
# extension) is the policy name.
policies_dir = "/etc/carriers/policies"

[smarthost]
# Outbound copies are relayed here. A local MTA (Postfix/Exim) is the intended target: it
# owns queueing, retries, MX resolution and outbound TLS.
host = "127.0.0.1"
port = 25
# Implicit TLS (SMTPS). Leave false for a local relay.
implicit_tls = false
# Permit plaintext delivery. Only sensible for a trusted local relay (e.g. 127.0.0.1).
allow_plaintext = true

# Bounce handling (optional; defaults shown). Delivery copies use a per-recipient VERP
# return path, so bounces come back addressed to the failing subscriber. Each bounce adds a
# weight to that subscriber's score; when it reaches `threshold`, delivery to them is disabled
# until re-enabled with `carriers member enable <list> <address>`.
[bounce]
threshold = 5.0    # score at which delivery is disabled
hard_weight = 3.0  # weight of a permanent (5.x.x) failure
soft_weight = 1.0  # weight of a transient (4.x.x) failure
