[package]
name = "carriers-sieve"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Run/debug a carriers Sieve policy against .eml or mbox messages, from the command line or as a script shebang"
publish = false

[[bin]]
name = "carriers-sieve"
path = "src/main.rs"

[dependencies]
carriers-core.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json = "1"
clap = { version = "4.6.1", features = ["derive"] }
